---
# =============================================================================
# Telco Hub Pattern - Hub Cluster Configuration
# =============================================================================
# This file defines the hub cluster configuration for the telco-hub pattern.
# The hub cluster serves as the central management point for the entire telco
# infrastructure, providing GitOps, cluster management, and policy enforcement.
#
# =============================================================================
# HUB CLUSTER GROUP CONFIGURATION
# =============================================================================

clusterGroup:
  # Cluster identification and role
  name: hub                               # Name of this cluster group
  isHubCluster: true                      # Designates this as the hub/management cluster

  # Management of below resource is delegated to the telco-hub kustomization app
  # in order to prevent systematic conflicts between the Pattern operator and
  # the Telco Hub Reference Design Specifications.
  namespaces: []
  subscriptions: {}
  projects: {}

  # =============================================================================
  # TELCO HUB APPLICATION
  # =============================================================================
  applications:

    telco-hub:
      name: telco-hub
      project: default                         # ArgoCD project for RBAC and policies
      kustomize: true                          # Use Kustomize for manifest processing
      path: kustomize/overlays/telco-hub

      # ArgoCD synchronization behavior configuration
      syncPolicy:
        automated:
          prune: true                          # Remove resources not in Git

  argoCD:
    controller:
      resources:
        limits:
          cpu: "16"
          memory: 32Gi
        requests:
          cpu: "1"
          memory: 2Gi
    kustomizeBuildOptions: "--enable-alpha-plugins"
    repo:
      resources:
        limits:
          cpu: "8"
          memory: "16Gi"
        requests:
          cpu: "1"
          memory: "2Gi"
      extraVolumes:
        - name: "kustomize"
          emptyDir: {}
      extraInitContainers:
        - name: "kustomize-plugin"
          command:
            - "/exportkustomize.sh"
          args:
            - "/.config"
          imagePullPolicy: "Always"
          volumeMounts:
            - name: "kustomize"
              mountPath: "/.config"
          terminationMessagePolicy: "File"
          terminationMessagePath: "/dev/termination-log"
          image: "registry.redhat.io/openshift4/ztp-site-generate-rhel8:v4.19"
        - name: "policy-generator-install"
          image: "registry.redhat.io/rhacm2/multicluster-operators-subscription-rhel9:v2.13"
          imagePullPolicy: "Always"
          volumeMounts:
            - name: "kustomize"
              mountPath: "/.config"
          args:
            - "-c"
            - "mkdir -p /.config/kustomize/plugin/policy.open-cluster-management.io/v1/policygenerator && cp /policy-generator/PolicyGenerator-not-fips-compliant /.config/kustomize/plugin/policy.open-cluster-management.io/v1/policygenerator/PolicyGenerator"
          command:
            - "/bin/bash"
      extraVolumeMounts:
        - name: "kustomize"
          mountPath: "/.config"
      env:
        - name: "ARGOCD_EXEC_TIMEOUT"
          value: "360s"
        - name: "KUSTOMIZE_PLUGIN_HOME"
          value: "/.config/kustomize/plugin"
